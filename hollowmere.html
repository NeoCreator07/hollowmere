  if(MAP.leaf&&canopies.length&&falling.length<44)spawnLeaf()}

function carrierPos(c){

class Flag{
 constructor(team){this.team=team;this.home=new THREE.Vector3(BASES[team].x,0,BASES[team].z);
  this.pos=this.home.clone();this.state=0;this.carrier=null;this.ret=0;
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,3.5,8),M.metal);pole.position.y=1.75;pole.castShadow=true;g.add(pole);
  const fin=new THREE.Mesh(new THREE.ConeGeometry(.1,.3,8),M.metal);fin.position.y=3.6;g.add(fin);

  this.cloth.position.set(.83,2.9,0);g.add(this.cloth);

 reset(){this.state=0;this.carrier=null;this.ret=0;this.pos.copy(this.home);
  if(this._c&&this._c.carrying!==undefined)this._c.carrying=false;this._c=null}
 take(c){this._c=(c&&c.g)?c:c;this.state=1;this.carrier=c;this.ret=0}

  this.state=2;this.carrier=null;this.ret=25;this.pos.set(x,0,z)}
 tick(dt,t){

  pa.needsUpdate=true;this.cloth.geometry.computeVertexNormals()}}

function buildStyle(){

 const trySpot=(w,d)=>{for(let t=0;t<30;t++){const a=rnd()*TAU,rad=16+rnd()*26;
  const x=Math.cos(a)*rad,z=Math.sin(a)*rad;
  if(gh(x,z)<.1)continue;
  if(spots.some(s=>Math.abs(s.x-x)<(s.w+w)/2+3&&Math.abs(s.z-z)<(s.d+d)/2+3))continue;
  spots.push({x,z,w,d});return {x,z,w,d}}return null};
 const mats=MAP.bmat.map(k=>M[k]);
 if(st==='ring'||st==='scatter'){
  for(let i=0;i<MAP.bld;i++){const s=trySpot(6.5+rnd()*4.5,6.5+rnd()*4.5);
   if(s)building(s.x,s.z,s.w,s.d,3.6+rnd()*2.8,mats[(rnd()*mats.length)|0])}}
 else if(st==='rows'){

function groundAt(x,z,curY){let g=gh(x,z);
 for(const b of boxes){if(x>b.x0-.3&&x<b.x1+.3&&z>b.z0-.3&&z<b.z1+.3){
  if(b.y1<=curY+.6&&b.y1>g)g=b.y1}}
 return g}
function collide(px,pz,r,curY){
 for(const b of boxes){
  if(b.y1<=curY+.6)continue;
  if(px>b.x0-r&&px<b.x1+r&&pz>b.z0-r&&pz<b.z1+r&&curY+1.75>b.y0&&curY+.2<b.y1){
   const d1=px-(b.x0-r),d2=(b.x1+r)-px,d3=pz-(b.z0-r),d4=(b.z1+r)-pz;
   const m=Math.min(d1,d2,d3,d4);
   if(m===d1)px=b.x0-r;else if(m===d2)px=b.x1+r;else if(m===d3)pz=b.z0-r;else pz=b.z1+r}}
 const jx=px-veh.x,jz=pz-veh.z,jd=Math.hypot(jx,jz);
 if(veh.g.visible&&jd<2&&Math.abs(curY-gh(veh.x,veh.z))<2){px=veh.x+jx/jd*2;pz=veh.z+jz/jd*2}
 return [px,pz]}
let vx=0,vz=0;
function playerUpdate(dt){
 if(player.dead){player.deadT-=dt;
  if(player.deadT<=0){player.dead=false;player.hp=100;
   const sp=BASES[0];player.x=sp.x;player.z=sp.z+3;player.y=gh(player.x,player.z);player.vy=0;
   banner('BACK IN','Walk it off.');queueAct('up')}return}
 const sprint=keys.ShiftLeft&&!adsT;
 const sp2=(sprint?8.4:5.3)*(ads>.5?.6:1);
 let ix=0,iz=0;
 if(keys.KeyW)iz-=1;if(keys.KeyS)iz+=1;if(keys.KeyA)ix-=1;if(keys.KeyD)ix+=1;
 const l=Math.hypot(ix,iz)||1;ix/=l;iz/=l;
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 const wx=(fx*-iz+rx*ix)*sp2,wz=(fz*-iz+rz*ix)*sp2;
 const k=1-Math.pow(.0002,dt);vx=lerp(vx,wx,k);vz=lerp(vz,wz,k);
 let nx=player.x+vx*dt,nz=player.z+vz*dt;
 if(gh(nx,nz)<-.85){nx=player.x;nz=player.z;vx=vz=0}
 [nx,nz]=collide(nx,nz,.38,player.y);player.x=nx;player.z=nz;
 player.vy-=22*dt;player.y+=player.vy*dt;
 const g=groundAt(player.x,player.z,player.y);
 if(player.y<=g){player.y=g;player.vy=0;grounded=true}else grounded=false;
 if(grounded&&keys.Space){player.vy=7.4;grounded=false}
 walkPhase+=Math.hypot(vx,vz)*dt*1.35;
 player.regenT-=dt;
 if(player.regenT<=0)player.hp=Math.min(100,player.hp+4.5*dt)}

function vehUpdate(dt){
 if(veh.driver==='G'&&!authority()){
  const th=(keys.KeyW?1:0)-(keys.KeyS?1:0);

  if(!th)guestV*=Math.pow(.35,dt);

  veh.a+=st*Math.min(1,Math.abs(guestV)/7)*1.55*dt*Math.sign(guestV||1);

  const nx=veh.x+Math.sin(veh.a)*guestV*dt,nz=veh.z+Math.cos(veh.a)*guestV*dt;
  if(gh(nx,nz)<-.4||hitBox(nx,nz,1.7))guestV*=-.3;else{veh.x=nx;veh.z=nz}

 else if(veh.driver!=='G'){

   const th=(keys.KeyW?1:0)-(keys.KeyS?1:0);
   veh.v+=th*(th>0?8.5:6)*dt;veh.v=clamp(veh.v,-7,17);
   if(!th)veh.v*=Math.pow(.35,dt);
   const st=(keys.KeyD?1:0)-(keys.KeyA?1:0);
   veh.a+=st*Math.min(1,Math.abs(veh.v)/7)*1.55*dt*Math.sign(veh.v||1);
   if(keys.Space)veh.v*=Math.pow(.02,dt);
   if(eng)eng.g.gain.value=.05*SET.vol;
  }else veh.v*=Math.pow(.2,dt);
  const nx=veh.x+Math.sin(veh.a)*veh.v*dt,nz=veh.z+Math.cos(veh.a)*veh.v*dt;
  if(gh(nx,nz)<-.4||hitBox(nx,nz,1.7)||Math.hypot(nx,nz)>84){veh.v*=-.3}
  else{veh.x=nx;veh.z=nz}
  if(veh.driver==='H'&&Math.abs(veh.v)>5&&state==='play'){
   for(const ag of agents){if(!ag.alive||ag.team!==1)continue;
    if(Math.hypot(ag.g.position.x-veh.x,ag.g.position.z-veh.z)<2&&Math.abs(gh(ag.g.position.x,ag.g.position.z)-gh(veh.x,veh.z))<1.6){
     killAgent(ag,null,PAINTC[(Math.random()*PAINTC.length)|0]);shake+=.25}}}}
 veh.g.position.set(veh.x,gh(veh.x,veh.z)+.5,veh.z);veh.g.rotation.y=veh.a;
 const spin=(authority()||veh.driver!=='G'?veh.v:guestV)*dt*2.4;
 for(const w of veh.wheels)w.rotation.x+=spin;
 if(eng)eng.o.frequency.value=52+Math.abs(veh.v)*13;
 if(driving){player.x=veh.x;player.z=veh.z;player.y=veh.g.position.y-.5}}

/* ============ networking — WebSocket relay through the Cloudflare Worker ============
   · `player` is the LOCAL entity: keyboard/mouse write to it and nothing else.
   · `RP` (RemotePlayer) is the PARTNER entity: it only exists in co-op, is
     created from the first 'p' packet, and is moved exclusively by
     remoteTick() — a frame-rate-independent interpolation toward the latest
     network state, so it stays smooth between packets.
   · Room roles: the first socket in a room is HOST. The host simulates every
     bot, flag, wave and vehicle, and broadcasts 's' snapshots at 10 Hz. The
     guest sends its own position ('p' at 12.5 Hz) plus hit claims ('hit');
     the worker relays every message verbatim to the other socket.
   · Actions (reload, dry fire, grenade, weapon swap, down/up) piggyback on
     the 'p' packet as `act`, so the partner sees what you are doing.       */
